name: Fundamental

on:
  schedule:
    # Kalender 3-star US + berita kredibel, tiap 3 jam di menit :13. Jendela
    # blackout di job daily dihitung dari WAKTU event di kalender (bukan waktu
    # fetch), dan event terjadwal hari ke depan sudah ada di kalender lama —
    # jadi daily tetap benar meski fundamental terakhir jalan <=6 jam lalu;
    # nilai "aktual" rilis menyusul di run berikutnya. 8x/hari (naik dari 6)
    # masih sopan ke sumber (Trading Economics + whitelist).
    - cron: "13 1-23/3 * * *"
    # Cadangan anti-drop (GitHub sering menunda/DROP run terjadwal):
    # slot :28 = 15 menit setelah utama. Job idempotent — kalau keduanya
    # jalan, data kalender/berita hanya di-refresh ulang.
    - cron: "28 1-23/3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fundamental
  cancel-in-progress: false

jobs:
  fundamental:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Collect calendar + news
        run: python -m analyzer.jobs.fundamental

      - name: Commit updated data
        run: |
          git config user.name "analyzer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/calendar.json data/news.json
          if git diff --cached --quiet; then
            echo "No data changes, nothing to commit."
          else
            git commit -m "data: fundamental $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main
            git push
          fi
