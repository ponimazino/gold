name: Laporan Harian

on:
  schedule:
    # Laporan PDF EOD harian: 23:07 WIB Sen-Jum (16:07 UTC) — setelah slot
    # grid daily terakhir (22:37 WIB) selesai, jadi log EOD tracking.json
    # sudah ter-update. Slot cadangan 23:53 WIB anti-drop (GitHub sering
    # menunda run terjadwal; job idempotent, nama file per-tanggal sama).
    - cron: "7 16 * * 1-5"
    - cron: "53 16 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build daily PDF report
        run: python -m analyzer.jobs.report

      - name: Commit report
        run: |
          git config user.name "analyzer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/reports/
          if git diff --cached --quiet; then
            echo "No report changes, nothing to commit."
          else
            git commit -m "data: laporan harian $(date -u +'%Y-%m-%d') UTC"
            git pull --rebase origin main
            git push
          fi