name: Analisa Harian

on:
  schedule:
    # Grid 2 jam (WIB) 04:37-22:37, Senin-Jumat, menit :37 (ganjil, anti
    # antrean runner). Grid 2 jam = tiap pasangan candle H1 dievaluasi
    # tepat sekali (logika pola "2 bar terakhir" tidak ada yang terlewat).
    # Anchor jam krusial: 04:37 pra-open Sydney 05:00 · 14:37 open London
    # · 20:37 open NY + rilis data AS 8:30 ET (19:30/20:30 WIB).
    # Cron UTC = WIB-7: 04:37/06:37 WIB = 21:37/23:37 UTC hari sebelumnya
    # (baris kedua, Min-Kam UTC), 08:37-22:37 WIB = 01:37-15:37 UTC hari sama.
    # Catatan: open London/NY bergeser ±1 jam WIB sepanjang tahun (DST US/EU)
    # — grid ini tetap, hanya jarak ke open berubah maksimal 1 jam.
    - cron: "37 1-15/2 * * 1-5"  # Sen-Jum UTC 01:37-15:37 = 08:37-22:37 WIB hari sama
    - cron: "37 21,23 * * 0-4"   # Min-Kam UTC 21:37/23:37 = 04:37/06:37 WIB hari berikutnya
    # Cadangan anti-drop: GitHub Actions terbukti DROP mayoritas run
    # terjadwal (2026-09-08: grid 10 slot jalan 0). Slot :52 memberi
    # kesempatan kedua tiap grid; PLUS job ini sekarang ber-mode watch loop:
    # begitu satu run lolos, runner tetap hidup ~6 jam dan tiap 2 jam
    # (sync dulu + analisa + commit). Job juga TIDAK lagi bergantung pada
    # workflow sync — tiap iterasi menjalankan sync sendiri sebelum analisa,
    # jadi rekomendasi selalu memakai candle terbaru. Semua idempotent:
    # recommendation.json dioverwrite, tracking dedup per hari WIB.
    - cron: "52 1-15/2 * * 1-5"
    - cron: "52 21,23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  # Run baru (slot berikutnya yang lolos) menggantikan loop lama —
  # maksimal satu loop analisa aktif.
  cancel-in-progress: true

jobs:
  daily:
    runs-on: ubuntu-latest
    # Batas keras job GitHub = 6 jam; loop internal berhenti di ~5j50m.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Watch loop — sync + analisa + commit tiap 2 jam (maks ~6 jam)
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          # Web Push ke PWA (2026-09-09): kosong = notif dilewati tanpa error.
          # Subscription disimpan sebagai Secret (repo public — endpoint
          # subscription tidak boleh ter-expose).
          PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
          PUSH_CONTACT_EMAIL: ${{ secrets.PUSH_CONTACT_EMAIL }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
        run: |
          git config user.name "analyzer-bot"
          git config user.email "actions@users.noreply.github.com"
          end=$(( $(date +%s) + 21000 ))  # ~5j50m, keluar bersih sebelum timeout
          iter=0
          while [ "$(date +%s)" -lt "$end" ]; do
            iter=$((iter+1))
            echo "=== iterasi $iter · $(date -u +'%Y-%m-%d %H:%M') UTC ==="
            # 0. mulai dari kondisi terbaru origin (commit loop sync / analisa
            #    lain) — working tree masih bersih di titik ini.
            #    -X theirs: hunk konflik data/*.json diselesaikan otomatis
            #    dengan versi commit lokal (barusan sync — paling segar);
            #    kalau salah, gap-filling iterasi berikutnya memulihkan.
            if ! git pull --rebase -X theirs origin main; then
              git rebase --abort || true
              git reset --hard origin/main
              echo "[watch] konflik rebase awal — reset ke origin/main"
            fi
            # 1. sync candle dulu — analisa tidak pernah pakai data basi
            #    (workflow sync bisa saja di-drop GitHub jam-jam sebelumnya)
            python -m analyzer.jobs.sync || echo "[watch] sync gagal — analisa pakai data tersimpan"
            # 2. research + rekomendasi + feedback loop
            python -m analyzer.jobs.daily || echo "[watch] analisa gagal — coba iterasi berikutnya"
            git add data
            if git diff --cached --quiet; then
              echo "Tidak ada perubahan — tidak commit."
            else
              git commit -m "data: rekomendasi harian $(date -u +'%Y-%m-%d %H:%M') UTC"
              # BUGFIX 2026-09-09: rebase polos KONFLIK dengan commit loop
              # sync (keduanya menulis data/xauusd_*.json) -> commit analisa
              # DIBUANG diam-diam tiap iterasi. -X theirs menyelesaikan
              # konflik otomatis: versi commit lokal menang (data barusan
              # di-sync + hasil analisa), commit loop sync terpisah tetap
              # utuh dalam sejarah.
              if git pull --rebase -X theirs origin main; then
                git push || echo "[watch] push gagal (race) — iterasi berikutnya mengejar"
              else
                # rebase gagal total: buang lokal, mulai dari origin/main —
                # iterasi berikutnya sync + analisa ulang.
                git rebase --abort || true
                git reset --hard origin/main
                echo "[watch] konflik rebase — reset ke origin/main"
              fi
            fi
            now=$(date +%s)
            [ "$now" -ge "$end" ] && break
            sleep $(( end - now < 7200 ? end - now : 7200 ))
          done
          echo "[watch] selesai setelah $iter iterasi"