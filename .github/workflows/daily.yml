name: Analisa Harian

on:
  schedule:
    # Grid 1 jam (WIB) 04:37-22:37, Senin-Jumat, menit :37 (ganjil, anti
    # antrean runner) + cadangan :52. Cron ini hanya PENJALAN LOOP — jam
    # analisa TIDAK lagi mengikuti menit start runner. Loop internal
    # (di-jangkar menit :07 UTC, lihat step di bawah) menganalisa tiap
    # jam tepat 7 menit setelah candle H1 close, analisa hanya pakai
    # candle CLOSED (`recommend._closed_only` membuang bar yang belum
    # selesai) — konsisten dengan backtest.
    # Kenapa tidak :37 lagi (audit 2026-09-23): GitHub menunda run
    # terjadwal 10-50 menit (bukti API run list: cron :37/:52 start
    # nyata :03-:44, tidak satu pun tepat waktu) + loop lama tidur
    # 3600 detik dari akhir iterasi -> menit analisa = menit start
    # acak + drift durasi iterasi (13-56 mnt setelah close).
    # Cron UTC = WIB-7: 04:37-06:37 WIB = 21:37-23:37 UTC hari sebelumnya
    # (baris kedua, Min-Kam UTC), 07:37-22:37 WIB = 00:37-15:37 UTC hari sama.
    # Catatan: open London/NY bergeser ±1 jam WIB sepanjang tahun (DST US/EU)
    # — grid ini tetap, hanya jarak ke open berubah maksimal 1 jam.
    - cron: "37 0-15 * * 1-5"   # Sen-Jum UTC 00:37-15:37 = 07:37-22:37 WIB hari sama
    - cron: "37 21-23 * * 0-4"  # Min-Kam UTC 21:37-23:37 = 04:37-06:37 WIB hari berikutnya
    # Cadangan anti-drop: GitHub Actions terbukti DROP mayoritas run
    # terjadwal (2026-09-08: grid 10 slot jalan 0). Slot :52 memberi
    # kesempatan kedua tiap grid; PLUS job ini ber-mode watch loop:
    # begitu satu run lolos, runner tetap hidup ~6 jam dan tiap 1 jam
    # (sync dulu + analisa + commit). Job juga TIDAK lagi bergantung pada
    # workflow sync — tiap iterasi menjalankan sync sendiri sebelum analisa,
    # jadi rekomendasi selalu memakai candle terbaru. Semua idempotent:
    # recommendation.json dioverwrite, tracking dedup per hari WIB.
    # Kuota Twelve Data: ~19 run/hari kerja x 2 request = ~38 kredit dari
    # 800/hari — masih jauh dari batas.
    - cron: "52 0-15 * * 1-5"
    - cron: "52 21-23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  # Run baru (slot berikutnya yang lolos) menggantikan loop lama —
  # maksimal satu loop analisa aktif.
  cancel-in-progress: true

jobs:
  daily:
    runs-on: ubuntu-latest
    # Batas keras job GitHub = 6 jam; loop internal berhenti di ~5j50m.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Watch loop — sync + analisa + commit tiap jam menit :07 UTC (maks ~6 jam)
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          # Web Push ke PWA (2026-09-09): kosong = notif dilewati tanpa error.
          # Subscription disimpan sebagai Secret (repo public — endpoint
          # subscription tidak boleh ter-expose).
          PUSH_VAPID_PRIVATE_KEY: ${{ secrets.PUSH_VAPID_PRIVATE_KEY }}
          PUSH_CONTACT_EMAIL: ${{ secrets.PUSH_CONTACT_EMAIL }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
          # WhatsApp via Fonnte (2026-09-20): token device + nomor WA tujuan
          # (format 62xxxxxxxxxx). Kosong = pesan WA dilewati tanpa error.
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
          FONNTE_TARGET: ${{ secrets.FONNTE_TARGET }}
        run: |
          git config user.name "analyzer-bot"
          git config user.email "actions@users.noreply.github.com"
          # JANGKAR MENIT TETAP (2026-09-23): iterasi analisa selalu dijalankan
          # menit :07 UTC = 7 menit setelah candle H1 close. Bukti amannya:
          # candle closed XAUUSD tersedia dari Twelve Data <1 menit setelah
          # close (audit 400 commit sync historis: umur termuda 0.7 mnt, 15
          # sampel <12 mnt) — buffer 7 menit cukup untuk API + sync, notif
          # masuk konsisten ~8 mnt setelah close (dulu 13-56 mnt acak).
          # Durasi iterasi ~1 mnt (research 1h ~10 dtk + 4h + sync + git).
          ANCHOR_MIN=7
          anchor_wait() {
            m=$(date -u +%-M); s=$(date -u +%-S)
            w=$(( (ANCHOR_MIN - m) * 60 - s ))
            [ "$w" -le 0 ] && w=$(( w + 3600 ))
            echo "$w"
          }
          end=$(( $(date +%s) + 21000 ))  # ~5j50m, keluar bersih sebelum timeout
          iter=0
          while [ "$(date +%s)" -lt "$end" ]; do
            iter=$((iter+1))
            echo "=== iterasi $iter · $(date -u +'%Y-%m-%d %H:%M') UTC ==="
            # 0. mulai dari kondisi terbaru origin (commit loop sync / analisa
            #    lain) — working tree masih bersih di titik ini.
            #    -X theirs: hunk konflik data/*.json diselesaikan otomatis
            #    dengan versi commit lokal (barusan sync — paling segar);
            #    kalau salah, gap-filling iterasi berikutnya memulihkan.
            if ! git pull --rebase -X theirs origin main; then
              git rebase --abort || true
              git reset --hard origin/main
              echo "[watch] konflik rebase awal — reset ke origin/main"
            fi
            # 1. sync candle dulu — analisa tidak pernah pakai data basi
            #    (workflow sync bisa saja di-drop GitHub jam-jam sebelumnya)
            python -m analyzer.jobs.sync || echo "[watch] sync gagal — analisa pakai data tersimpan"
            # 2. research + rekomendasi + feedback loop
            python -m analyzer.jobs.daily || echo "[watch] analisa gagal — coba iterasi berikutnya"
            git add data
            if git diff --cached --quiet; then
              echo "Tidak ada perubahan — tidak commit."
            else
              git commit -m "data: rekomendasi harian $(date -u +'%Y-%m-%d %H:%M') UTC"
              # BUGFIX 2026-09-09: rebase polos KONFLIK dengan commit loop
              # sync (keduanya menulis data/xauusd_*.json) -> commit analisa
              # DIBUANG diam-diam tiap iterasi. -X theirs menyelesaikan
              # konflik otomatis: versi commit lokal menang (data barusan
              # di-sync + hasil analisa), commit loop sync terpisah tetap
              # utuh dalam sejarah.
              if git pull --rebase -X theirs origin main; then
                git push || echo "[watch] push gagal (race) — iterasi berikutnya mengejar"
              else
                # rebase gagal total: buang lokal, mulai dari origin/main —
                # iterasi berikutnya sync + analisa ulang.
                git rebase --abort || true
                git reset --hard origin/main
                echo "[watch] konflik rebase — reset ke origin/main"
              fi
            fi
            now=$(date +%s)
            [ "$now" -ge "$end" ] && break
            # tidur sampai menit :07 UTC berikutnya (jangkar jam, BUKAN
            # 3600 dtk dari sekarang — menit analisa tidak ikut drift
            # durasi iterasi). Iterasi PERTAMA tetap langsung jalan saat
            # run mulai (loop lama di-cancel, jangan ada jam kosong;
            # dispatch manual verifikasi kode baru juga instan).
            # Batas 5j50m: jangan tidur melewati end.
            aw=$(anchor_wait)
            left=$(( end - now ))
            [ "$aw" -gt "$left" ] && aw=$left
            sleep "$aw"
          done
          echo "[watch] selesai setelah $iter iterasi"
