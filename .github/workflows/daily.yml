name: Analisa Harian

on:
  schedule:
    # Grid 2 jam (WIB) 04:37-22:37, Senin-Jumat, menit :37 (ganjil, anti
    # antrean runner) — SELALU 20 menit setelah sync :17 jadi rekomendasi
    # memakai candle terbaru. Grid 2 jam = tiap pasangan candle H1 dievaluasi
    # tepat sekali (logika pola "2 bar terakhir" tidak ada yang terlewat).
    # Anchor jam krusial: 04:37 pra-open Sydney 05:00 · 14:37 open London
    # · 20:37 open NY + rilis data AS 8:30 ET (19:30/20:30 WIB).
    # Cron UTC = WIB-7: 04:37/06:37 WIB = 21:37/23:37 UTC hari sebelumnya
    # (baris kedua, Min-Kam UTC), 08:37-22:37 WIB = 01:37-15:37 UTC hari sama.
    # Catatan: open London/NY bergeser ±1 jam WIB sepanjang tahun (DST US/EU)
    # — grid ini tetap, hanya jarak ke open berubah maksimal 1 jam.
    - cron: "37 1-15/2 * * 1-5"  # Sen-Jum UTC 01:37-15:37 = 08:37-22:37 WIB hari sama
    - cron: "37 21,23 * * 0-4"   # Min-Kam UTC 21:37/23:37 = 04:37/06:37 WIB hari berikutnya
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build recommendation + update tracking
        run: python -m analyzer.jobs.daily

      - name: Commit updated data
        run: |
          git config user.name "analyzer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/patterns.json data/recommendation.json data/tracking.json
          if git diff --cached --quiet; then
            echo "No data changes, nothing to commit."
          else
            git commit -m "data: rekomendasi harian $(date -u +'%Y-%m-%d') UTC"
            git pull --rebase origin main
            git push
          fi
