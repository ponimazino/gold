name: Backfill

on:
  workflow_dispatch:
    inputs:
      years:
        description: "How far back to fetch (years)"
        required: false
        default: "3"

permissions:
  contents: write

concurrency:
  group: backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run backfill
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python -m analyzer.jobs.backfill --years ${{ github.event.inputs.years || '3' }}

      - name: Commit updated data
        run: |
          git config user.name "analyzer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes, nothing to commit."
          else
            git commit -m "data: backfill ${{ github.event.inputs.years || '3' }}y"
            git pull --rebase origin main
            git push
          fi
