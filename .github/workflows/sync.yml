name: Hourly Sync

on:
  schedule:
    # Every hour, ALL days including Sunday (Twelve Data menyediakan bar
    # Minggu). DUA slot per jam (:17 utama + :47 cadangan) karena GitHub
    # Actions terbukti sering menunda/DROP run terjadwal — 2026-09-08 hanya
    # 2 dari 48 slot/hari yang jalan.
    # Strategi: sekali run MASUK, job tidak langsung selesai — runner tetap
    # hidup ~6 jam (watch loop) dan sync + commit tiap 30 menit. Asal 3-4
    # run/hari lolos dari GitHub, data tidak pernah basi berjam-jam.
    # Job idempotent + gap-filling (jam terlewat dikejar iterasi berikutnya).
    # Kuota Twelve Data: 2 request per iterasi; cancel-in-progress membatasi
    # maks 1 loop aktif -> ~24-48 request per run yang lolos, jauh di bawah
    # 800 kredit gratis/hari.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-sync
  # Run baru (jadwal berikutnya yang lolos) MENGGANTIKAN loop lama —
  # selalu maksimal satu loop sync aktif, kuota API terkendali.
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    # Batas keras job GitHub = 6 jam; loop internal berhenti di ~5j50m.
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Watch loop — sync + commit tiap 30 menit (maks ~6 jam)
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: |
          git config user.name "analyzer-bot"
          git config user.email "actions@users.noreply.github.com"
          end=$(( $(date +%s) + 21000 ))  # ~5j50m, keluar bersih sebelum timeout
          iter=0
          while [ "$(date +%s)" -lt "$end" ]; do
            iter=$((iter+1))
            echo "=== iterasi $iter · $(date -u +'%Y-%m-%d %H:%M') UTC ==="
            # 0. mulai dari kondisi terbaru origin (commit loop analisa /
            #    sync lain). -X theirs: hunk konflik diselesaikan otomatis
            #    dengan versi commit lokal (barusan sync — paling segar);
            #    gap-filling iterasi berikutnya memulihkan kalau salah.
            if ! git pull --rebase -X theirs origin main; then
              git rebase --abort || true
              git reset --hard origin/main
              echo "[watch] konflik rebase awal — reset ke origin/main"
            fi
            python -m analyzer.jobs.sync || echo "[watch] sync gagal — coba iterasi berikutnya"
            git add data
            if git diff --cached --quiet; then
              echo "Tidak ada data baru — tidak commit."
            else
              git commit -m "data: hourly sync $(date -u +'%Y-%m-%d %H:%M') UTC"
              # BUGFIX 2026-09-09: rebase polos konflik dengan commit loop
              # analisa (keduanya menulis data/xauusd_*.json) -> commit
              # sync dibuang. -X theirs = versi lokal (paling segar) menang.
              if git pull --rebase -X theirs origin main; then
                git push || echo "[watch] push gagal (race) — iterasi berikutnya mengejar"
              else
                # rebase gagal total: buang lokal, mulai dari origin/main —
                # iterasi berikutnya re-sync (gap-filling).
                git rebase --abort || true
                git reset --hard origin/main
                echo "[watch] konflik rebase — reset ke origin/main"
              fi
            fi
            now=$(date +%s)
            [ "$now" -ge "$end" ] && break
            sleep $(( end - now < 1800 ? end - now : 1800 ))
          done
          echo "[watch] selesai setelah $iter iterasi"