name: Hourly Sync

on:
  schedule:
    # Every hour, ALL days including Sunday (Twelve Data menyediakan bar
    # Minggu). DUA slot per jam (:17 utama + :47 cadangan) karena GitHub
    # Actions terbukti sering menunda/DROP run terjadwal di menit ramai —
    # dengan cadangan, paling lambat data baru masuk ~47 menit.
    # Job idempotent + gap-filling (jam terlewat dikejar di run berikutnya),
    # jadi dobel-run aman. Kuota aman: 2 request/run x maks 48 = 96 dari
    # 800 kredit gratis Twelve Data per hari.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hourly-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run sync
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
        run: python -m analyzer.jobs.sync

      - name: Commit updated data
        run: |
          git config user.name "analyzer-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No new data, nothing to commit."
          else
            git commit -m "data: hourly sync $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase origin main
            git push
          fi
